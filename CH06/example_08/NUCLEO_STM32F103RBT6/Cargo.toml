[package]
name = "app"
version = "0.1.0"
authors = ["David Cabanis <davidcabanis@gmail.com>"]
edition = "2021"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "1.0.0"
rtt-target = "0.6"

[profile.release]
opt-level = 1
debug = true
