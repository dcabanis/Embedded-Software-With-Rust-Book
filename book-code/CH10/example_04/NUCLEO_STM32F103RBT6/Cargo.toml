[package]
name = "app"
version = "0.1.0"
authors = ["David Cabanis <davidcabanis@gmail.com>"]
edition = "2021"

[profile.release]
debug = 2

[dependencies]
embassy-executor = { version = "=0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-stm32 = { version = "=0.6.0", features = ["stm32f103rb", "time-driver-tim2", "memory-x"] }
embassy-time = "=0.5.1"
embassy-sync = "=0.8.0"
cortex-m = { version = "=0.7.9", features = ["critical-section-single-core"] }
cortex-m-rt = "=0.7.6"
cortex-m-semihosting = "0.6"
static_cell = "=2.1.1"
panic-halt = "=1.0.0"
