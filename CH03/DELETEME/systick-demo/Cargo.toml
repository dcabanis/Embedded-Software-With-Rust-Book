[package]
name = "systick-demo"
version = "0.1.0"
authors = ["dcabanis"]
edition = "2021"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "1.0.0"


[dependencies.stm32f1xx-hal]
version = "0.10.0"
features = ["stm32f103", ]



# Set the default for dependencies.
[profile.dev.package."*"]
opt-level = "s"

[profile.release]
codegen-units = 1
incremental = false
debug = true
lto = true
opt-level = "s"
