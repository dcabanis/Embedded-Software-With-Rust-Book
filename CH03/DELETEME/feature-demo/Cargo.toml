[package]
name = "feature-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"

# Optional panic backends (exactly one should be active)
panic-halt = { version = "1.0.0", optional = true }
panic-semihosting = { version = "0.6", optional = true }

# Optional semihosting I/O (only needed if you want hprintln!, etc.)
cortex-m-semihosting = { version = "0.5", optional = true }
cargo-edit = "0.13.8"

[dependencies.stm32f1xx-hal]
version = "0.10.0"
features = ["stm32f103", "rt", "medium"]

[features]
# Default build: no semihosting, halt on panic
default = ["dep:panic-halt"]

# Semihosting build: print panic messages via semihosting
# (also enable the I/O crate so you can demonstrate hprintln!)
semihosting = ["dep:panic-semihosting", "dep:cortex-m-semihosting"]
